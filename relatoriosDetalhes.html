<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chás da Laura - Detalhamento Expandido</title>
    <link class="stylesheet" href="style2.css">
</head>
<body>
    
    <main class="conteudo">
        
        <section class="topoLayoutRelatorio">
            <div class="titulos">
                <h1 class="tituloPagina">Produtos total por período</h1>
                <h3 class="subtituloPagina">Visualize o total produzido por produto no período selecionado</h3>
            </div>
            <div class="acoesExportacao">
                <button class="btnExportar excel"><span class="iconeExcel"></span> Exportar Excel (.xlsx)</button>
                <button class="btnExportar pdf"><span class="iconePdf"></span> Baixar PDF (.pdf)</button>
            </div>
        </section>

        <section class="conteinerFiltros">
            <div class="filtroItem">
                <label>Período</label>
                <select><option>01/05/2025 - 31/05/2026</option></select>
            </div>
            <div class="filtroItem">
                <label>Produto</label>
                <select><option>Todos os produtos</option></select>
            </div>
            <div class="filtroItem">
                <label>Status</label>
                <select><option>Todos</option></select>
            </div>
            <div class="botoesFiltro">
                <button class="botaoFiltrar">Filtrar</button>
            </div>
        </section>

        <section class="conteinerTabelaCompleta">
            <div class="utilitariosTabela">
                <div class="barraBusca">
                    <input type="text" placeholder="Buscar produto...">
                </div>
                <div class="ordenacao">
                    <label>Ordenar por:</label>
                    <select><option>Maior quantidade produzida</option></select>
                </div>
            </div>

            <table>
                <thead>
                    <tr>
                        <th>Semana</th>
                        <th>Produto</th>
                        <th>Quantidade produzida</th>
                        <th>Receita utilizada</th>
                        <th>Custo da produção</th>
                        <th>Responsável</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>20/05 - 26/05</td>
                        <td><span class="indicadorCor b1"></span> Bled 1 - 50g</td>
                        <td>50 un</td>
                        <td>Receita 1</td>
                        <td>R$ 294,00</td>
                        <td>Laura</td>
                    </tr>
                    </tbody>
                <tfoot>
                    <tr class="linhaTotalGeral">
                        <td>TOTAL GERAL</td>
                        <td></td>
                        <td>950 UN</td>
                        <td></td>
                        <td>R$ 5.586,00</td>
                        <td></td>
                    </tr>
                </tfoot>

                </table>
        </section>
    </main>
</body>
</html>
