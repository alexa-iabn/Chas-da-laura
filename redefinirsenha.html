<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="stylesabrina.css">
<title>Redefinir Senha</title>
</head>

<body class="paginaCadastro">

    <section class="ladoCadastroImagem">
        <img src="Imagens/Logo.png" class="logoCadastro" alt="Logo Chás da Laura">

        <h1>Sistema de Gestão<br>de Estoque</h1>

        <p>
            Organize, controle e acompanhe seu estoque em<br>
            tempo real de forma simples e inteligente
        </p>

        <img src="Imagens/ChaImagemMenu.png" class="imagemCadastroCha" alt="Chá da Laura">
    </section>

    <section class="ladoCadastroFormulario">

        <div class="cardLogin">

            <h2>Redefinir senha</h2>

            <p>
                Informe o email da sua conta para receber as<br>
                instruções de redefinição de senha
            </p>

            <form>
                <label>E-mail</label>
                <input type="email" placeholder="Digite seu e-mail">

                <button class="botaoCadastrar">
                    Enviar link de recuperação
                </button>

                <div class="separador">ou</div>

                <a href="login.html">
                    <button type="button" class="botaoVoltar">
                        ← Voltar para o login
                    </button>
                </a>
            </form>

        </div>

    </section>

<script src="app.js"></script>
<script src="js/redefinirsenha.js"></script>
</body>
</html>
