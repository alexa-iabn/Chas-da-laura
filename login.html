<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Chás da Laura</title>
    <link rel="stylesheet" href="stylesabrina.css">
</head>

<body class="paginaLogin">

    <!-- LADO ESQUERDO -->
    <section class="ladoLoginImagem">

        <img src="Imagens/Logo.png" class="logoLogin" alt="Logo Chás da Laura">

        <h1>
            Sistema de Gestão<br>
            de Estoque
        </h1>

        <p>
            Organize, controle e acompanhe seu estoque em<br>
            tempo real de forma simples e inteligente
        </p>

        <img src="Imagens/ChaImagemMenu.png" class="chaLogin" alt="Chá da Laura">

    </section>

    <!-- LADO DIREITO -->
    <section class="ladoLoginFormulario">

        <div class="cardLogin">

            <h2>Bem-vindo de volta!</h2>

            <p class="subtituloLogin">
                Faça login para acessar sua conta
            </p>

            <form>

                <label>E-mail</label>
                <input type="email" placeholder="Digite seu e-mail">

                <label>Senha</label>
                <input type="password" placeholder="Digite sua senha">

                <div class="linhaLogin">

                    <label class="lembrar">
                        <input type="checkbox">
                        Lembrar-me
                    </label>

                    <a href="redefinirsenha.html">
                        Esqueci minha senha
                    </a>

                </div>

                <button type="submit" class="botaoEntrar">
                    Entrar
                </button>

                <p class="textoCadastro">
                    Não tem uma conta?
                    <a href="cadastro.html">Cadastrar-se</a>
                </p>

            </form>

        </div>

    </section>

</body>
</html>
